apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: microservices-demo
build:
  tagPolicy:
    envTemplate:
      template: "{{.IMAGE_NAME}}:{{.GIT_COMMIT}}"
  artifacts:
    - image: micro/emailservice
      context: src/emailservice
    - image: micro/productcatalogservice
      context: src/productcatalogservice
    - image: micro/recommendationservice
      context: src/recommendationservice
    - image: micro/shoppingassistantservice
      context: src/shoppingassistantservice
    - image: micro/shippingservice
      context: src/shippingservice
    - image: micro/checkoutservice
      context: src/checkoutservice
    - image: micro/paymentservice
      context: src/paymentservice
    - image: micro/currencyservice
      context: src/currencyservice
    - image: micro/cartservice
      context: src/cartservice/src
      docker:
        dockerfile: Dockerfile
    - image: micro/frontend
      context: src/frontend
    - image: micro/adservice
      context: src/adservice
  local:
    push: true
    useDockerCLI: true
    useBuildkit: true
